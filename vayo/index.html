const planState={pace:"balanced",start:null,end:null,day:0,events:[]};
const DAY_START=7*60,DAY_END=23*60,STEP=30,ROW_H=60;
function dateDiff(a,b){if(!a||!b)return 1;return Math.max(1,Math.round((new Date(b)-new Date(a))/86400000)+1)}
function fmtDate(v){if(!v)return "Select date";return new Date(v+"T00:00:00").toLocaleDateString(undefined,{day:"2-digit",month:"short",year:"numeric"})}
function minsToTime(m){const h=Math.floor(m/60),mm=m%60;return String(h%12||12)+":"+String(mm).padStart(2,"0")+" "+(h<12?"AM":"PM")}
function durationLabel(){const n=dateDiff(planState.start,planState.end);return n+"D / "+(n-1)+"N"}
function snap(v){return Math.max(DAY_START,Math.min(DAY_END-STEP,Math.round(v/STEP)*STEP))}
function buildModules(filter=""){
 const lib=document.getElementById("moduleLibrary"), q=filter.trim().toLowerCase(); lib.innerHTML=""; const groups={};
 planModules.filter(m=>!q||m.name.toLowerCase().includes(q)||m.cat.toLowerCase().includes(q)).forEach(m=>(groups[m.cat]??=[]).push(m));
 Object.entries(groups).forEach(([cat,mods])=>{const g=document.createElement("div");g.className="moduleGroup";g.innerHTML='<div class="moduleGroupTitle">'+cat+'</div>';mods.forEach(m=>{const c=document.createElement("div");c.className="moduleCard";c.draggable=true;c.dataset.module=m.id;c.innerHTML='<div class="moduleName">'+m.name+'</div><div class="moduleMeta">'+m.dur+' min · prototype ₹'+m.cost.toLocaleString("en-IN")+'</div>';c.addEventListener("dragstart",e=>{e.dataTransfer.setData("moduleId",m.id);e.dataTransfer.effectAllowed="copy"});g.appendChild(c)});lib.appendChild(g)});
}
function suggestedEvents(){const d=planState.day;if(d>0)return;const base=planState.pace==="rest"?[["checkin",10*60],["lunch",12*60],["spa",15*60],["sunset",17*60],["candleDinner",20*60]]:planState.pace==="explore"?[["breakfast",8*60],["boat",10*60],["lunch",13*60],["temple",15*60],["photo",18*60],["dinner",20*60]]:[["breakfast",8*60],["ayurveda",9*60+30],["boat",12*60],["lunch",15*60],["rest",16*60],["sunset",18*60],["dinner",20*60]];
 planState.events=base.map(([moduleId,start])=>({id:crypto.randomUUID(),day:0,start,duration:planModules.find(m=>m.id===moduleId).dur,moduleId}));
}
function renderDays(){const tabs=document.getElementById("dayTabs");tabs.innerHTML="";const n=dateDiff(planState.start,planState.end);for(let i=0;i<n;i++){const b=document.createElement("button");b.className="dayTab"+(i===planState.day?" active":"");b.textContent="Day "+(i+1);b.onclick=()=>{planState.day=i;renderCalendar()};tabs.appendChild(b)}}
function renderTimeAxis(){const a=document.getElementById("timeAxis");a.innerHTML="";for(let h=7;h<=23;h++){const s=document.createElement("span");s.style.top=((h-7)*ROW_H)+"px";s.textContent=(h%12||12)+":00 "+(h<12?"AM":"PM");a.appendChild(s)}}
function eventAtDrop(y){const tl=document.getElementById("timeline"),r=tl.getBoundingClientRect();return snap(DAY_START+((y-r.top)/r.height)*(DAY_END-DAY_START))}
function hasOverlap(ev,ignoreId){return planState.events.some(x=>x.id!==ignoreId&&x.day===ev.day&&ev.start<x.start+x.duration&&ev.start+ev.duration>x.start)}
function renderCalendar(){
 renderDays();renderTimeAxis();const title=document.getElementById("dayTitle"),date=planState.start?new Date(new Date(planState.start+"T00:00:00").getTime()+planState.day*86400000).toISOString().slice(0,10):null;title.textContent="Day "+(planState.day+1)+(date?" · "+fmtDate(date):"");
 const tl=document.getElementById("timeline");tl.innerHTML="";const dayEvents=planState.events.filter(e=>e.day===planState.day);
 if(!dayEvents.length){const h=document.createElement("div");h.className="dropHint";h.textContent="Drop modules anywhere in the timeline";tl.appendChild(h)}
 dayEvents.forEach(e=>{const m=planModules.find(x=>x.id===e.moduleId);if(!m)return;const card=document.createElement("div");card.className="planEvent";card.draggable=true;card.dataset.eventId=e.id;const top=((e.start-DAY_START)/(DAY_END-DAY_START))*100,height=Math.max(3,(e.duration/(DAY_END-DAY_START))*100);card.style.top=top+"%";card.style.height=height+"%";card.innerHTML='<div><strong>'+m.name+'</strong><div class="eventTime">'+minsToTime(e.start)+' – '+minsToTime(e.start+e.duration)+' · '+e.duration+' min</div></div><button class="removeEvent" aria-label="Remove">×</button><div class="eventResize" aria-label="Resize duration"></div>';
 card.addEventListener("dragstart",x=>x.dataTransfer.setData("eventId",e.id));card.querySelector(".removeEvent").onclick=()=>{planState.events=planState.events.filter(x=>x.id!==e.id);renderCalendar()};
 const handle=card.querySelector(".eventResize");handle.onmousedown=ev=>{ev.preventDefault();ev.stopPropagation();document.body.classList.add("resizeActive");const startY=ev.clientY,startDur=e.duration;const move=mm=>{const tlr=tl.getBoundingClientRect(),delta=Math.round(((mm.clientY-startY)/tlr.height)*(DAY_END-DAY_START)/STEP)*STEP;e.duration=Math.max(STEP,Math.min(DAY_END-e.start,startDur+delta));renderCalendar()};const up=()=>{document.body.classList.remove("resizeActive");document.removeEventListener("mousemove",move);document.removeEventListener("mouseup",up)};document.addEventListener("mousemove",move);document.addEventListener("mouseup",up)};
 tl.appendChild(card)});
 tl.ondragover=e=>{e.preventDefault();tl.classList.add("dragover")};tl.ondragleave=()=>tl.classList.remove("dragover");tl.ondrop=e=>{e.preventDefault();tl.classList.remove("dragover");const mid=e.dataTransfer.getData("moduleId"),eid=e.dataTransfer.getData("eventId"),start=eventAtDrop(e.clientY);if(eid){const ev=planState.events.find(x=>x.id===eid);if(ev){const candidate={...ev,day:planState.day,start};if(!hasOverlap(candidate,ev.id))Object.assign(ev,{day:planState.day,start})}}else if(mid){const m=planModules.find(x=>x.id===mid);const candidate={id:crypto.randomUUID(),day:planState.day,start,duration:m.dur,moduleId:mid};if(candidate.start+candidate.duration<=DAY_END&&!hasOverlap(candidate))planState.events.push(candidate);else showToast("That module does not fit there. Drop it later or extend the day.");}renderCalendar()};
 const chosen=document.getElementById("planExperience").value;document.getElementById("planSummaryText").textContent=planState.pace.replace(/^./,x=>x.toUpperCase())+" · "+chosen+" · "+durationLabel();
 const total=planState.events.reduce((sum,e)=>sum+(planModules.find(m=>m.id===e.moduleId)?.cost||0),0);document.getElementById("planPrice").textContent="Estimated from ₹"+total.toLocaleString("en-IN");
}
function initialisePlan(){
 const s=document.getElementById("planStart"),e=document.getElementById("planEnd");if(!s.value){const d=new Date();d.setDate(d.getDate()+14);s.value=d.toISOString().slice(0,10)}if(!e.value){const d=new Date(s.value+"T00:00:00");d.setDate(d.getDate()+1);e.value=d.toISOString().slice(0,10)}
 planState.start=s.value;planState.end=e.value;s.onchange=()=>{planState.start=s.value;planState.day=0;suggestedEvents();renderCalendar()};e.onchange=()=>{planState.end=e.value;planState.day=0;suggestedEvents();renderCalendar()};document.getElementById("planExperience").onchange=()=>{suggestedEvents();renderCalendar()};
 document.querySelectorAll(".paceTab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".paceTab").forEach(x=>x.classList.remove("active"));b.classList.add("active");planState.pace=b.dataset.pace;suggestedEvents();renderCalendar()});
 document.getElementById("moduleSearch").oninput=e=>buildModules(e.target.value);document.getElementById("clearPlan").onclick=()=>{planState.events=[];renderCalendar()};document.getElementById("savePlan").onclick=()=>{localStorage.setItem("vayoPlan",JSON.stringify(planState));showToast("Plan saved on this device.")};
 document.getElementById("exportPdf").onclick=exportPlanPdf;document.getElementById("exportXls").onclick=exportPlanXls;buildModules();suggestedEvents();renderCalendar();
}
function exportPlanPdf(){const box=document.getElementById("printPlan");const n=dateDiff(planState.start,planState.end);let html='<div class="printPage"><div class="printHeader"><h1>VAYO / Custom Journey</h1><div class="printMuted">'+document.getElementById("planExperience").value+' · '+durationLabel()+' · '+planState.pace+'</div></div>';for(let d=0;d<n;d++){html+='<div class="printDay"><h2>Day '+(d+1)+'</h2>';planState.events.filter(e=>e.day===d).sort((a,b)=>a.start-b.start).forEach(e=>{const m=planModules.find(x=>x.id===e.moduleId);html+='<div class="printRow"><div>'+minsToTime(e.start)+'</div><div><strong>'+m.name+'</strong><br><span class="printMuted">'+m.cat+'</span></div><div>'+e.duration+' min</div></div>'});html+='</div>'}html+='</div>';box.innerHTML=html;window.print();setTimeout(()=>box.innerHTML="",500)}
function exportPlanXls(){if(!window.XLSX){showToast("Spreadsheet library is still loading — try again in a moment.");return}const rows=[["VAYO CUSTOM JOURNEY"],["Experience",document.getElementById("planExperience").value],["Dates",fmtDate(planState.start)+" → "+fmtDate(planState.end)],["Pace",planState.pace],[],["Day","Start","End","Duration (min)","Category","Module","Prototype Cost (₹)"]];const n=dateDiff(planState.start,planState.end);for(let d=0;d<n;d++)planState.events.filter(e=>e.day===d).sort((a,b)=>a.start-b.start).forEach(e=>{const m=planModules.find(x=>x.id===e.moduleId);rows.push([d+1,minsToTime(e.start),minsToTime(e.start+e.duration),e.duration,m.cat,m.name,m.cost])});const ws=XLSX.utils.aoa_to_sheet(rows);ws["!cols"]=[{wch:8},{wch:13},{wch:13},{wch:15},{wch:24},{wch:32},{wch:18}];const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"Itinerary");XLSX.writeFile(wb,"VAYO-Custom-Journey.xlsx",{compression:true});}

function openSeniorPackage(){document.getElementById("seniorPackageModal").classList.add("open");document.body.style.overflow="hidden";renderSeniorPackage("short")}function closeSeniorPackage(){document.getElementById("seniorPackageModal").classList.remove("open");document.body.style.overflow=""}function renderSeniorPackage(which){const box=document.getElementById("seniorPackageContent");box.innerHTML=seniorItineraries[which].map(d=>'<div class="itineraryBlock"><div class="itineraryDay">'+d[0]+'</div>'+d[1].map(r=>'<div class="itineraryRow"><div class="itineraryTime">'+r[0]+'</div><div class="itineraryText">'+r[1]+'</div></div>').join('')+'</div>').join('');document.querySelectorAll("[data-sp]").forEach(b=>b.classList.toggle("active",b.dataset.sp===which))}document.querySelectorAll("[data-sp]").forEach(b=>b.onclick=()=>renderSeniorPackage(b.dataset.sp));document.getElementById("seniorPackageModal").addEventListener("click",e=>{if(e.target.id==="seniorPackageModal")closeSeniorPackage()});\n</script>
